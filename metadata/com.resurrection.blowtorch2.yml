Builds:
  - versionName: '2.2.4'
    versionCode: 257
    commit: v2.2.4
    subdir: BT_Free
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y openjdk-17-jdk-headless gcc make
      - update-alternatives --auto java || true
    gradle:
      - production
    ndk: r26b
    srclibs:
      - LuaJIT@3c4f9fe2052b8d08a917ac0d5f38563f0297b5a3
    prebuild: sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
    build: export NDK_HOME=$$NDK$$ ANDROID_HOME=$$SDK$$ LUAJIT_21_DIR=$$LuaJIT$$ && cd .. && ./build_ndk_libraries.sh
    scandelete:
      - BTLib/key

