MaintainerNotes: |
  Native libs are produced by ./build_ndk_libraries.sh into BTLib/libs/ (not
  committed). Release signing is left unset unless BT_LOCAL_SIGN=1; F-Droid
  signs the APK. Package id is com.resurrection.blowtorch2 (production flavor).
  Uses MANAGE_EXTERNAL_STORAGE so default user files can live under /BlowTorch/
  (settings, backups, launcher, session_logs, logs) outside Android/data.
  This is optional for playing; see docs/FDROID_README.md for the full
  permission justification aimed at reviewers and users.

  LuaJIT 2.1 (needed for arm64-v8a; 2.0.5 does not support it) has no upstream
  release, only a moving v2.1 branch, so it is not vendored here. From 2.2.4 the
  recipe passes a srclib checkout to the build script as LUAJIT_21_DIR and the
  script fetches nothing. That srclib does not exist in fdroiddata yet and has
  to be added alongside this recipe:

    srclibs/LuaJIT.yml
      RepoType: git
      Repo: https://github.com/LuaJIT/LuaJIT.git

  Without LUAJIT_21_DIR the script falls back to fetching the same pinned commit
  itself, which is what a developer laptop does.

