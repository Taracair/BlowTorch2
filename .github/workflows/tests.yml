name: tests

# The JVM and Lua tests existed for months and nothing ran them; a regression in
# the trigger matcher (audit finding 1b) shipped past a suite that would have
# caught it. This is the gate.
#
# No APK is built here on purpose: the prebuilt LuaJIT .so files under
# BTLib/libs are not in git, so a clone cannot assemble one.

on:
  push:
    branches: [ main, staging ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sourceCompatibility is 17 in both modules.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks

      - name: Run the same checks as scripts/check.sh
        run: ./scripts/check.sh

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: BTLib/build/reports/tests/
          if-no-files-found: ignore
