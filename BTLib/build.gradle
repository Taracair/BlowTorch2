plugins {
    id 'com.android.library'
}

android {
    namespace 'com.resurrection.blowtorch2.lib'
    compileSdk 36

    defaultConfig {
        minSdk 28
        targetSdk 36
        versionCode 219
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // GitHub APKs keep the automatic check on. F-Droid's recipe appends
        // blowtorch.fdroid=true so the APK they compile defaults it off
        // (reviewers adb-install that artifact; installer-name tricks miss that).
        buildConfigField "boolean", "UPDATE_CHECK_ON_BY_DEFAULT",
                ((findProperty("blowtorch.fdroid") ?: "false").toString() == "true")
                        ? "false" : "true"
        // Off unless a flavor turns it on. The writer is not in this source set.
        buildConfigField "boolean", "TIMING_TRACE", "false"
        // Fat APK for phones/tablets: 32-bit + 64-bit ARM (covers virtually all devices).
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Same dimension and names as :BT_Free. F-Droid builds `production`, which
    // compiles the empty TimingTrace. The writer is src/btTest only.
    flavorDimensions += "edition"
    productFlavors {
        btTest {
            dimension "edition"
            buildConfigField "boolean", "TIMING_TRACE", "true"
        }
        production {
            dimension "edition"
            buildConfigField "boolean", "TIMING_TRACE", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            java.exclude('**/androidTest/**', '**/test/**', 'btTest/**', 'production/**')
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
        androidTest {
            java.srcDirs = ['src/androidTest/java']
        }
        test {
            java.srcDirs = ['src/test/java']
        }
        btTest.java.srcDirs = ['src/btTest/java']
        production.java.srcDirs = ['src/production/java']
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Flavors replace testDebugUnitTest. Keep the old name so check.sh and
// deploy.sh still run both variants' JVM tests.
afterEvaluate {
    if (tasks.findByName('testDebugUnitTest') == null) {
        tasks.register('testDebugUnitTest') {
            dependsOn 'testBtTestDebugUnitTest', 'testProductionDebugUnitTest'
            group = 'verification'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (Android stubs throw "not mocked").
    testImplementation 'org.json:json:20240303'
}
